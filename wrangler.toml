name = "aurora-store"
compatibility_date = "2026-01-01"

# Cloudflare Pages: сайт полностью статический + functions/ (Pages Functions)
pages_build_output_dir = "."

# ─────────────────────────────────────────────────────────────
# Биндинги (созданы и привязаны автоматически)
[[kv_namespaces]]
binding = "PRODUCTS"
id = "ab04e15554ba487698a8be375a8363be"

# Фото хранятся в том же KV, пока не включён R2.
# После включения R2 в дашборде раскомментируйте блок ниже и сделайте redeploy —
# загрузки автоматически переедут в R2 (старые ссылки /img/ продолжат работать).
[[kv_namespaces]]
binding = "MEDIA_KV"
id = "ab04e15554ba487698a8be375a8363be"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "aurora-media"
# ─────────────────────────────────────────────────────────────
